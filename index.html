          {
            "@type": "Question",
            "name": "Why would refinancing to a lower payment ever cost more overall?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "If the new loan resets the clock to a longer term, you pay interest for far more months, which can outweigh a lower rate. This calculator's lifetime interest comparison exists specifically to catch that."
            }
          },
          {
            "@type": "Question",
            "name": "What counts as breakeven on a refinance?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The point where your accumulated monthly savings equal what you paid in closing costs. Stay in the home past that point and the refinance was worth it on cash flow; leave sooner and it wasn't."
            }
          },
          {
            "@type": "Question",
            "name": "Is this financial advice?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, it's a calculator for comparing the numbers you enter. Always get a real Loan Estimate from a lender before deciding, since taxes, insurance, PMI and points can all affect the real comparison."
            }
          }
        ]
      }
